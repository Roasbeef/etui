name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.16.0"
          rebar3-version: "3"
          # elixir-version: "1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: gleam deps download
      - run: gleam test
      # The suite has to run on JavaScript too, not just the smoke app. Several
      # buffer paths are native on Erlang and fall back to the Gleam body on
      # JavaScript, and the two silently disagreed about non-ASCII input until
      # someone ran the tests on both.
      - run: gleam test --target javascript
      - run: gleam format --check src test dev
      - run: gleam run --target javascript -m etui_js_smoke
